{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <div class="row text-start">
        <h1 class="mb-4">Отмена публикации продукта</h1>
        <div class="col-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <p>Вы уверены, что хотите отменить публикацию продукта "{{ object.name }}"?</p>
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning">Отменить публикацию</button>
                        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
